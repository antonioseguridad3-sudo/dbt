version: 2

sources:

  - name: POSTGRE_DB # name of the source 
    schema: POSTGRE_DB # this is the schema our raw data lives in
    database: DB09_DEV_BRONZE_DB # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false
    config: 
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}

    tables:

      - name: ADDRESSES
        config: 
          loaded_at_field: _fivetran_synced
        columns:
          - name: ADDRESS
          - name: ADDRESS_ID
          - name: COUNTRY
          - name: STATE
          - name: ZIPCODE
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED

      - name: ORDERITEMS
        config: 
          loaded_at_field: _fivetran_synced
        columns:
          - name: ORDER_ID
          - name: PRODUCT_ID
          - name: QUANTITY
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED

      - name: ORDERS
        config: 
          loaded_at_field: _fivetran_synced
        columns:
          - name: ADDRESS_ID
          - name: CREATED_AT
          - name: DELIVERED_AT
          - name: ESTIMATED_DELIVERY_AT
          - name: ORDER_COST
          - name: ORDER_COST
          - name: ORDER_TOTAL
          - name: PROMO_ID
          - name: SHIPPING_COST
          - name: SHIPPING_SERVICE
          - name: STATUS
          - name: TRACKING_ID
          - name: USER_ID
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED

      - name: PRODUCTS
        config: 
         loaded_at_field: _fivetran_synced
        columns:
          - name: INVENTORY
          - name: NAME
          - name: PRICE
          - name: PRODUCT_ID
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
      - name: PROMOS
        config: 
          loaded_at_field: _fivetran_synced
        columns:
          - name: DISCOUNT
          - name: PROMO_ID
          - name: STATUS
          - name: _FIVETRAN_DELETE
          - name: _FIVETRAN_SYNCED

      - name: USER
        config: 
          loaded_at_field: _fivetran_synced
        columns:
          - name: ADDRESS_ID
          - name: CREATED_AT
          - name: EMAIL
          - name: FIRST_NAME
          - name: LAST_NAME
          - name: PHONE_NUMBER
          - name: TOTAL_ORDERS
          - name: UPDATED_AT
          - name: USER_ID
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED
